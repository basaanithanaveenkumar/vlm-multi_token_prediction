variant: basic_vlm_scratch
model:
  architecture: basic
  max_length: 32
  vision:
    image_size: 224
  scratch:
    embed_dim: 512
    vocab_size: 30522
    tokenizer_id: bert-base-uncased
    coco_max_length: 17
train:
  backend: scratch
  batch_size: 4
  lr: 1.0e-4
  max_epochs: 2
  log_tensorboard: false
data:
  source: coco_lavis
logging:
  backend: noop
experiment:
  enabled: false
device: cpu
